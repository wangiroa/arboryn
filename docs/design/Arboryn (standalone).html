document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"fr\" data-theme=\"light\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Arboryn<\u002Ftitle>\n<style>/* =====================================================================\n   ARBORYN — Fluent Design (Windows 11) design tokens\n   Light + Dark. Accent = vert forêt.\n   Token names mirror WinUI 3 ThemeResource keys where practical.\n   ===================================================================== */\n\n:root {\n  /* ---- Accent ramp (vert forêt) -------------------------------------- */\n  --accent-dark3:  #11502A;\n  --accent-dark2:  #186236;\n  --accent-dark1:  #1F7340;\n  --accent-base:   #2E8B4F;   /* couleur de marque */\n  --accent-light1: #43A062;\n  --accent-light2: #61B97D;\n  --accent-light3: #84CE9B;\n\n  /* ---- Spacing scale ------------------------------------------------- */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-12: 48px;\n\n  /* ---- Corner radius ------------------------------------------------- */\n  --radius-control: 4px;   /* boutons, inputs */\n  --radius-card:    8px;   /* cartes, surfaces */\n  --radius-overlay: 8px;   /* flyouts, dialogs */\n  --radius-pill:    999px;\n\n  /* ---- Type ramp (Segoe UI Variable) --------------------------------- */\n  --font-family: \"Segoe UI Variable\", \"Segoe UI Variable Display\",\n    \"Segoe UI\", system-ui, -apple-system, \"Selawik\", \"Open Sans\", sans-serif;\n  --font-icon: \"Segoe Fluent Icons\", \"Segoe MDL2 Assets\";\n\n  --type-caption-size: 12px;   --type-caption-lh: 16px;   --type-caption-w: 400;\n  --type-body-size:    14px;   --type-body-lh:    20px;   --type-body-w:    400;\n  --type-bodystrong-w: 600;\n  --type-bodylg-size:  18px;   --type-bodylg-lh:  24px;   --type-bodylg-w:  400;\n  --type-subtitle-size:20px;   --type-subtitle-lh:28px;   --type-subtitle-w:600;\n  --type-title-size:   28px;   --type-title-lh:   36px;   --type-title-w:   600;\n  --type-titlelg-size: 40px;   --type-titlelg-lh: 52px;   --type-titlelg-w: 600;\n  --type-display-size: 68px;   --type-display-lh: 92px;   --type-display-w: 600;\n\n  /* ---- Motion -------------------------------------------------------- */\n  --motion-fast: 120ms;\n  --motion-normal: 200ms;\n  --motion-slow: 320ms;\n  --ease-standard: cubic-bezier(0.33, 0, 0.67, 1);     /* Fluent standard */\n  --ease-decel:    cubic-bezier(0.1, 0.9, 0.2, 1);     /* point-to-point */\n}\n\n/* =====================================================================\n   LIGHT THEME\n   ===================================================================== */\n:root,\n[data-theme=\"light\"] {\n  color-scheme: light;\n\n  /* Surfaces / fills */\n  --app-bg: #F3F3F3;                              /* Mica base */\n  --app-bg-image: radial-gradient(140% 120% at 8% -10%, rgba(46,139,79,0.08), transparent 42%),\n                  radial-gradient(120% 130% at 100% 0%, rgba(46,139,79,0.05), transparent 46%);\n  --solid-base:        #F3F3F3;\n  --solid-secondary:   #EEEEEE;\n  --solid-tertiary:    #F9F9F9;\n  --solid-quarternary: #FFFFFF;\n  --layer-default:     rgba(255,255,255,0.50);\n  --layer-alt:         #FFFFFF;\n  --card-default:      rgba(255,255,255,0.70);\n  --card-secondary:    rgba(246,246,246,0.50);\n  --smoke-fill:        rgba(0,0,0,0.30);          /* dialog scrim */\n\n  /* Control fills */\n  --control-default:   rgba(255,255,255,0.70);\n  --control-secondary: rgba(249,249,249,0.50);\n  --control-tertiary:  rgba(249,249,249,0.30);\n  --control-disabled:  rgba(249,249,249,0.30);\n  --control-strong:    rgba(0,0,0,0.45);          /* checkbox border etc. */\n  --subtle-hover:      rgba(0,0,0,0.0373);\n  --subtle-pressed:    rgba(0,0,0,0.0241);\n  --subtle-secondary:  rgba(0,0,0,0.0241);\n\n  /* Text */\n  --text-primary:   rgba(0,0,0,0.8956);\n  --text-secondary: rgba(0,0,0,0.6063);\n  --text-tertiary:  rgba(0,0,0,0.4458);\n  --text-disabled:  rgba(0,0,0,0.3614);\n  --text-on-accent: #FFFFFF;\n  --text-on-accent-disabled: rgba(255,255,255,0.70);\n\n  /* Accent in-context */\n  --accent-fill:        var(--accent-dark1);      /* boutons accent */\n  --accent-fill-hover:  var(--accent-base);\n  --accent-fill-press:  var(--accent-dark2);\n  --accent-text:        var(--accent-dark2);      /* liens, texte accent */\n  --accent-selected-bg: rgba(46,139,79,0.12);\n\n  /* Strokes */\n  --stroke-card:     rgba(0,0,0,0.0578);\n  --stroke-divider:  rgba(0,0,0,0.0803);\n  --stroke-control:  rgba(0,0,0,0.0578);\n  --stroke-control-strong: rgba(0,0,0,0.16);\n  --stroke-surface:  rgba(117,117,117,0.40);\n  --focus-stroke-outer: #000000;\n  --focus-stroke-inner: #FFFFFF;\n\n  /* Semantic */\n  --success:    #0F7B0F;  --success-bg: #DFF6DD;\n  --caution:    #9D5D00;  --caution-bg: #FFF4CE;\n  --danger:     #C42B1C;  --danger-bg:  #FDE7E9;\n  --info:       #005FB8;  --info-bg:    #EFF4FB;\n\n  /* Elevation */\n  --shadow-card:    0 1px 2px rgba(0,0,0,0.07), 0 0 1px rgba(0,0,0,0.06);\n  --shadow-flyout:  0 8px 16px rgba(0,0,0,0.14);\n  --shadow-dialog:  0 32px 64px rgba(0,0,0,0.1875);\n  --shadow-tooltip: 0 4px 8px rgba(0,0,0,0.14);\n\n  /* Cover placeholder gradient */\n  --cover-1: linear-gradient(135deg, #5B8C6E, #2E5E45);\n  --cover-2: linear-gradient(135deg, #7E8AA6, #3F4A66);\n  --cover-3: linear-gradient(135deg, #B08D57, #6E5328);\n}\n\n/* =====================================================================\n   DARK THEME\n   ===================================================================== */\n[data-theme=\"dark\"] {\n  color-scheme: dark;\n\n  --app-bg: #202020;\n  --app-bg-image: radial-gradient(140% 120% at 8% -10%, rgba(97,185,125,0.10), transparent 42%),\n                  radial-gradient(120% 130% at 100% 0%, rgba(46,139,79,0.07), transparent 46%);\n  --solid-base:        #202020;\n  --solid-secondary:   #1C1C1C;\n  --solid-tertiary:    #282828;\n  --solid-quarternary: #2C2C2C;\n  --layer-default:     rgba(58,58,58,0.30);\n  --layer-alt:         rgba(255,255,255,0.0538);\n  --card-default:      rgba(255,255,255,0.0512);\n  --card-secondary:    rgba(255,255,255,0.0326);\n  --smoke-fill:        rgba(0,0,0,0.30);\n\n  --control-default:   rgba(255,255,255,0.0605);\n  --control-secondary: rgba(255,255,255,0.0837);\n  --control-tertiary:  rgba(255,255,255,0.0326);\n  --control-disabled:  rgba(255,255,255,0.0419);\n  --control-strong:    rgba(255,255,255,0.5442);\n  --subtle-hover:      rgba(255,255,255,0.0605);\n  --subtle-pressed:    rgba(255,255,255,0.0419);\n  --subtle-secondary:  rgba(255,255,255,0.0419);\n\n  --text-primary:   #FFFFFF;\n  --text-secondary: rgba(255,255,255,0.786);\n  --text-tertiary:  rgba(255,255,255,0.5442);\n  --text-disabled:  rgba(255,255,255,0.3628);\n  --text-on-accent: #000000;\n  --text-on-accent-disabled: rgba(0,0,0,0.5302);\n\n  --accent-fill:        var(--accent-light2);     /* boutons accent, texte noir */\n  --accent-fill-hover:  var(--accent-light1);\n  --accent-fill-press:  var(--accent-light3);\n  --accent-text:        var(--accent-light3);\n  --accent-selected-bg: rgba(97,185,125,0.16);\n\n  --stroke-card:     rgba(0,0,0,0.10);\n  --stroke-divider:  rgba(255,255,255,0.0837);\n  --stroke-control:  rgba(255,255,255,0.0837);\n  --stroke-control-strong: rgba(255,255,255,0.0837);\n  --stroke-surface:  rgba(117,117,117,0.40);\n  --focus-stroke-outer: #FFFFFF;\n  --focus-stroke-inner: #000000;\n\n  --success:    #6CCB5F;  --success-bg: #393D1B;\n  --caution:    #FCE100;  --caution-bg: #433519;\n  --danger:     #FF99A4;  --danger-bg:  #442726;\n  --info:       #60CDFF;  --info-bg:    #243B4A;\n\n  --shadow-card:    0 1px 2px rgba(0,0,0,0.28), 0 0 1px rgba(0,0,0,0.30);\n  --shadow-flyout:  0 8px 16px rgba(0,0,0,0.26);\n  --shadow-dialog:  0 32px 64px rgba(0,0,0,0.37);\n  --shadow-tooltip: 0 4px 8px rgba(0,0,0,0.26);\n\n  --cover-1: linear-gradient(135deg, #3E7558, #1C3D2C);\n  --cover-2: linear-gradient(135deg, #4E5870, #2A3247);\n  --cover-3: linear-gradient(135deg, #8A6E43, #4A3819);\n}\n<\u002Fstyle>\n<style>/* =====================================================================\n   ARBORYN — Fluent components\n   Requires tokens.css.\n   ===================================================================== */\n\n* { box-sizing: border-box; }\nhtml, body { height: 100%; }\nbody {\n  margin: 0;\n  font-family: var(--font-family);\n  font-size: var(--type-body-size);\n  line-height: var(--type-body-lh);\n  color: var(--text-primary);\n  background: var(--app-bg);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* ---- Typography utilities -------------------------------------------- */\n.t-caption   { font-size: var(--type-caption-size);  line-height: var(--type-caption-lh);  font-weight: 400; }\n.t-body      { font-size: var(--type-body-size);     line-height: var(--type-body-lh);     font-weight: 400; }\n.t-body-strong { font-size: var(--type-body-size);   line-height: var(--type-body-lh);     font-weight: 600; }\n.t-body-lg   { font-size: var(--type-bodylg-size);   line-height: var(--type-bodylg-lh);   font-weight: 400; }\n.t-subtitle  { font-size: var(--type-subtitle-size); line-height: var(--type-subtitle-lh); font-weight: 600; letter-spacing: -0.01em; }\n.t-title     { font-size: var(--type-title-size);    line-height: var(--type-title-lh);    font-weight: 600; letter-spacing: -0.015em; }\n.t-title-lg  { font-size: var(--type-titlelg-size);  line-height: var(--type-titlelg-lh);  font-weight: 600; letter-spacing: -0.02em; }\n.t-display   { font-size: var(--type-display-size);  line-height: var(--type-display-lh);  font-weight: 600; letter-spacing: -0.02em; }\n.text-sec  { color: var(--text-secondary); }\n.text-ter  { color: var(--text-tertiary); }\n.text-accent { color: var(--accent-text); }\n.tabnum { font-variant-numeric: tabular-nums; }\n\n/* ---- Icon (inline SVG sprite) ---------------------------------------- */\n/* fill/stroke set on .ic so they INHERIT into <use>-referenced symbol content */\n.ic { width: 16px; height: 16px; flex: 0 0 auto; display: inline-block; vertical-align: -3px;\n  fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }\n.ic-20 { width: 20px; height: 20px; }\n.ic-24 { width: 24px; height: 24px; }\n.ic-32 { width: 32px; height: 32px; }\n\n/* =====================================================================\n   App shell\n   ===================================================================== */\n.app {\n  display: grid;\n  grid-template-columns: var(--rail-w, 280px) 1fr;\n  grid-template-rows: 48px 1fr auto;\n  grid-template-areas:\n    \"rail header\"\n    \"rail content\"\n    \"rail scanbar\";\n  height: 100vh;\n  background: var(--app-bg);\n  background-image: var(--app-bg-image);\n  overflow: hidden;\n}\n.app[data-rail=\"collapsed\"] { --rail-w: 60px; }\n\n/* ---- Title bar / window chrome -------------------------------------- */\n.titlebar {\n  grid-area: header;\n  display: flex; align-items: center; gap: var(--space-3);\n  padding: 0 var(--space-3) 0 var(--space-4);\n  -webkit-app-region: drag;\n  border-bottom: 1px solid var(--stroke-divider);\n}\n.titlebar > * { -webkit-app-region: no-drag; }\n\n.win-controls { display: flex; margin-left: auto; gap: 0; }\n.win-btn {\n  width: 46px; height: 32px; display: grid; place-items: center;\n  border: 0; background: transparent; color: var(--text-secondary);\n  border-radius: var(--radius-control); cursor: default;\n}\n.win-btn:hover { background: var(--subtle-hover); }\n.win-btn.close:hover { background: #C42B1C; color: #fff; }\n\n/* ---- Navigation rail ------------------------------------------------- */\n.rail {\n  grid-area: rail;\n  display: flex; flex-direction: column;\n  background: var(--solid-secondary);\n  border-right: 1px solid var(--stroke-divider);\n  padding: 6px var(--space-2) var(--space-2);\n  overflow: hidden;\n}\n[data-theme=\"dark\"] .rail { background: rgba(0,0,0,0.18); }\n.rail-top { display: flex; align-items: center; gap: var(--space-2); height: 40px; padding: 0 6px; }\n.rail-toggle {\n  width: 40px; height: 36px; border: 0; border-radius: var(--radius-control);\n  background: transparent; color: var(--text-primary); cursor: pointer;\n  display: grid; place-items: center;\n}\n.rail-toggle:hover { background: var(--subtle-hover); }\n.brand { display: flex; align-items: center; gap: var(--space-2); padding-left: 2px; overflow: hidden; }\n.brand-mark {\n  width: 28px; height: 28px; border-radius: 7px; flex: 0 0 auto;\n  display: grid; place-items: center; color: #fff;\n  background: linear-gradient(150deg, var(--accent-light1), var(--accent-dark2));\n  box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);\n}\n.brand-name { font-weight: 600; font-size: 15px; white-space: nowrap; }\n.app[data-rail=\"collapsed\"] .brand-name,\n.app[data-rail=\"collapsed\"] .nav-label,\n.app[data-rail=\"collapsed\"] .nav-group-label,\n.app[data-rail=\"collapsed\"] .nav-badge { display: none; }\n\n.rail-search {\n  margin: var(--space-2) 4px var(--space-1);\n}\n.app[data-rail=\"collapsed\"] .rail-search { display: none; }\n\n.nav-list { list-style: none; margin: 0; padding: var(--space-1) 0; overflow-y: auto; flex: 1; }\n.nav-list::-webkit-scrollbar { width: 8px; }\n.nav-list::-webkit-scrollbar-thumb { background: var(--control-strong); border-radius: 4px; border: 2px solid transparent; background-clip: content-box; }\n.nav-group-label { font-size: 11px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: .04em; padding: var(--space-3) 12px var(--space-1); }\n\n.nav-item {\n  position: relative;\n  display: flex; align-items: center; gap: var(--space-3);\n  height: 40px; padding: 0 12px; margin: 2px 0;\n  border-radius: var(--radius-control); cursor: pointer; color: var(--text-primary);\n  border: 1px solid transparent;\n  transition: background var(--motion-fast) var(--ease-standard);\n  white-space: nowrap;\n}\n.nav-item:hover { background: var(--subtle-hover); }\n.nav-item:active { background: var(--subtle-pressed); }\n.nav-item.active { background: var(--card-default); border-color: var(--stroke-card); box-shadow: var(--shadow-card); }\n.nav-item.active::before {\n  content: \"\"; position: absolute; left: -8px; top: 50%; transform: translateY(-50%);\n  width: 3px; height: 16px; border-radius: 2px; background: var(--accent-fill);\n  transition: height var(--motion-normal) var(--ease-decel);\n}\n.nav-item .ic { color: var(--text-secondary); }\n.nav-item.active .ic { color: var(--accent-text); }\n.nav-label { flex: 1; font-size: 14px; }\n.nav-badge {\n  min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--radius-pill);\n  background: var(--accent-fill); color: var(--text-on-accent);\n  font-size: 11px; font-weight: 600; display: grid; place-items: center;\n}\n.nav-badge.muted { background: var(--control-strong); color: var(--text-on-accent); }\n.app[data-rail=\"collapsed\"] .nav-item { justify-content: center; padding: 0; }\n\n.rail-foot { border-top: 1px solid var(--stroke-divider); padding-top: var(--space-1); }\n\n/* =====================================================================\n   Header (in-content command header)\n   ===================================================================== */\n.titlebar .search {\n  flex: 1; max-width: 540px; margin: 0 auto;\n}\n.search {\n  display: flex; align-items: center; gap: var(--space-2);\n  height: 32px; padding: 0 10px;\n  background: var(--control-default); border: 1px solid var(--stroke-control);\n  border-bottom-color: var(--stroke-control-strong);\n  border-radius: var(--radius-control); color: var(--text-secondary);\n}\n.search:focus-within { border-bottom: 2px solid var(--accent-fill); padding-bottom: 0; }\n.search input {\n  flex: 1; border: 0; background: transparent; outline: none;\n  font-family: inherit; font-size: 14px; color: var(--text-primary);\n}\n.search input::placeholder { color: var(--text-tertiary); }\n.kbd {\n  font-family: var(--font-family); font-size: 11px; color: var(--text-tertiary);\n  border: 1px solid var(--stroke-divider); border-radius: 4px; padding: 1px 5px;\n  background: var(--subtle-secondary);\n}\n\n.titlebar-meta { display: flex; align-items: center; gap: var(--space-2); }\n.vol-pill {\n  display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px;\n  background: var(--subtle-secondary); border: 1px solid var(--stroke-control);\n  border-radius: var(--radius-pill); font-size: 12px; font-weight: 600; cursor: pointer;\n}\n.vol-pill:hover { background: var(--subtle-hover); }\n.avatar {\n  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;\n  background: linear-gradient(150deg, var(--accent-light1), var(--accent-dark2));\n  color: #fff; font-size: 12px; font-weight: 600; cursor: pointer;\n}\n\n/* =====================================================================\n   Content area + page scaffold\n   ===================================================================== */\n.content { grid-area: content; overflow: hidden; display: flex; flex-direction: column; }\n.page { overflow-y: auto; padding: var(--space-8) var(--space-12) var(--space-12); flex: 1; }\n.page::-webkit-scrollbar { width: 12px; }\n.page::-webkit-scrollbar-thumb { background: var(--control-strong); border-radius: 6px; border: 4px solid transparent; background-clip: content-box; }\n.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-6); }\n.page-head .sub { color: var(--text-secondary); margin-top: 4px; }\n.breadcrumb { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 13px; margin-bottom: var(--space-2); }\n.breadcrumb a { color: var(--text-secondary); text-decoration: none; }\n.breadcrumb a:hover { color: var(--accent-text); }\n.breadcrumb .ic { width: 12px; height: 12px; opacity: .6; }\n\n/* =====================================================================\n   Buttons\n   ===================================================================== */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);\n  height: 32px; padding: 0 12px; border-radius: var(--radius-control);\n  font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;\n  border: 1px solid var(--stroke-control); border-bottom-color: var(--stroke-control-strong);\n  background: var(--control-default); color: var(--text-primary);\n  transition: background var(--motion-fast) var(--ease-standard);\n  white-space: nowrap;\n}\n.btn:hover { background: var(--subtle-hover); }\n.btn:active { background: var(--subtle-pressed); color: var(--text-secondary); }\n.btn.accent { background: var(--accent-fill); color: var(--text-on-accent); border-color: transparent; }\n.btn.accent:hover { background: var(--accent-fill-hover); }\n.btn.accent:active { background: var(--accent-fill-press); color: var(--text-on-accent-disabled); }\n.btn.subtle { background: transparent; border-color: transparent; }\n.btn.subtle:hover { background: var(--subtle-hover); }\n.btn.danger { background: var(--danger); color: #fff; border-color: transparent; }\n[data-theme=\"dark\"] .btn.danger { color: #000; }\n.btn.icon-only { width: 32px; padding: 0; }\n.btn.sm { height: 28px; font-size: 13px; padding: 0 10px; }\n.btn:disabled { background: var(--control-disabled); color: var(--text-disabled); cursor: default; }\n.btn .ic { width: 16px; height: 16px; }\n\n/* ---- Command bar ----------------------------------------------------- */\n.commandbar {\n  display: flex; align-items: center; gap: 2px; padding: 4px;\n  background: var(--card-secondary); border: 1px solid var(--stroke-card);\n  border-radius: var(--radius-card); margin-bottom: var(--space-4);\n}\n.cmd {\n  display: inline-flex; align-items: center; gap: var(--space-2);\n  height: 36px; padding: 0 12px; border: 0; border-radius: var(--radius-control);\n  background: transparent; color: var(--text-primary); font-family: inherit;\n  font-size: 14px; cursor: pointer;\n}\n.cmd:hover { background: var(--subtle-hover); }\n.cmd:disabled { color: var(--text-disabled); }\n.cmd .ic { color: var(--text-secondary); }\n.cmd-sep { width: 1px; height: 20px; background: var(--stroke-divider); margin: 0 4px; }\n.cmd.accent-text .ic, .cmd.accent-text { color: var(--accent-text); }\n\n/* =====================================================================\n   Cards\n   ===================================================================== */\n.card {\n  background: var(--card-default); border: 1px solid var(--stroke-card);\n  border-radius: var(--radius-card); box-shadow: var(--shadow-card);\n  padding: var(--space-6);\n}\n.card.tight { padding: var(--space-4); }\n.card-head { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4); }\n.card-head .ic { color: var(--accent-text); }\n.card-title { font-size: 16px; font-weight: 600; }\n.card-head .spacer { margin-left: auto; }\n\n.grid { display: grid; gap: var(--space-4); }\n.cols-2 { grid-template-columns: repeat(2, 1fr); }\n.cols-3 { grid-template-columns: repeat(3, 1fr); }\n.cols-4 { grid-template-columns: repeat(4, 1fr); }\n\n/* ---- Stat ------------------------------------------------------------ */\n.stat { display: flex; flex-direction: column; gap: 2px; }\n.stat .num { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }\n.stat .lbl { color: var(--text-secondary); font-size: 13px; }\n\n/* =====================================================================\n   Badges / pills\n   ===================================================================== */\n.badge {\n  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px;\n  border-radius: var(--radius-pill); font-size: 12px; font-weight: 600; white-space: nowrap;\n  background: var(--subtle-secondary); color: var(--text-secondary);\n  border: 1px solid var(--stroke-control);\n}\n.badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }\n.badge.success { background: var(--success-bg); color: var(--success); border-color: transparent; }\n.badge.caution { background: var(--caution-bg); color: var(--caution); border-color: transparent; }\n.badge.danger  { background: var(--danger-bg);  color: var(--danger);  border-color: transparent; }\n.badge.info    { background: var(--info-bg);    color: var(--info);    border-color: transparent; }\n.badge.accent  { background: var(--accent-selected-bg); color: var(--accent-text); border-color: transparent; }\n[data-theme=\"dark\"] .badge.caution { color: #FCE100; }\n\n/* confidence */\n.conf { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; }\n.conf .dot { width: 8px; height: 8px; border-radius: 50%; }\n.conf.high .dot { background: var(--success); }   .conf.high { color: var(--success); }\n.conf.mid  .dot { background: var(--caution); }    .conf.mid  { color: var(--caution); }\n.conf.low  .dot { background: var(--danger); }     .conf.low  { color: var(--danger); }\n\n/* online/offline status dot */\n.status-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }\n.status-dot.online  { background: var(--success); box-shadow: 0 0 0 3px var(--success-bg); }\n.status-dot.offline { background: var(--text-tertiary); }\n.status-dot.unknown { background: var(--caution); }\n\n/* =====================================================================\n   Progress\n   ===================================================================== */\n.bar { height: 6px; border-radius: 3px; background: var(--control-strong); overflow: hidden; opacity: .9; }\n.bar > i { display: block; height: 100%; border-radius: 3px; background: var(--accent-fill); }\n.bar.thin { height: 4px; }\n.bar.usage > i.warn { background: var(--caution); }\n.bar.usage > i.full { background: var(--danger); }\n\n.ring { --p: 0; width: 132px; height: 132px; border-radius: 50%;\n  background: conic-gradient(var(--seg, var(--accent-fill)) calc(var(--p)*1%), var(--control-strong) 0);\n  display: grid; place-items: center; }\n.ring::after { content: \"\"; position: absolute; }\n\n/* =====================================================================\n   InfoBar\n   ===================================================================== */\n.infobar {\n  display: flex; align-items: flex-start; gap: var(--space-3);\n  padding: var(--space-3) var(--space-4); border-radius: var(--radius-card);\n  border: 1px solid var(--stroke-card); background: var(--card-secondary);\n}\n.infobar .ic { flex: 0 0 auto; margin-top: 1px; }\n.infobar .ib-body { flex: 1; }\n.infobar .ib-title { font-weight: 600; }\n.infobar .ib-msg { color: var(--text-secondary); font-size: 13px; margin-top: 2px; }\n.infobar.success { background: var(--success-bg); border-color: transparent; } .infobar.success .ic { color: var(--success); }\n.infobar.caution { background: var(--caution-bg); border-color: transparent; } .infobar.caution .ic { color: var(--caution); }\n.infobar.danger  { background: var(--danger-bg);  border-color: transparent; } .infobar.danger .ic { color: var(--danger); }\n.infobar.info    { background: var(--info-bg);    border-color: transparent; } .infobar.info .ic { color: var(--info); }\n\n/* =====================================================================\n   DataGrid / table\n   ===================================================================== */\n.dg { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }\n.dg thead th {\n  text-align: left; font-weight: 600; color: var(--text-secondary); font-size: 13px;\n  padding: 10px var(--space-3); border-bottom: 1px solid var(--stroke-divider);\n  position: sticky; top: 0; background: var(--solid-base); z-index: 1;\n}\n.dg tbody td { padding: 11px var(--space-3); border-bottom: 1px solid var(--stroke-divider); vertical-align: middle; }\n.dg tbody tr { transition: background var(--motion-fast); }\n.dg tbody tr:hover { background: var(--subtle-hover); }\n.dg tbody tr.selected { background: var(--accent-selected-bg); }\n.dg tbody tr.selected td:first-child { box-shadow: inset 3px 0 0 var(--accent-fill); }\n.dg .num { text-align: right; font-variant-numeric: tabular-nums; }\n.dg .row-actions { opacity: 0; display: flex; gap: 2px; }\n.dg tbody tr:hover .row-actions { opacity: 1; }\n\n[data-density=\"compact\"] .dg thead th { padding: 6px var(--space-3); }\n[data-density=\"compact\"] .dg tbody td { padding: 5px var(--space-3); }\n[data-density=\"compact\"] .page { padding: var(--space-6) var(--space-8) var(--space-8); }\n\n/* checkbox */\n.chk { width: 20px; height: 20px; border-radius: 4px; border: 1.5px solid var(--control-strong);\n  display: inline-grid; place-items: center; cursor: pointer; background: var(--control-default); flex: 0 0 auto; }\n.chk.on { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--text-on-accent); }\n.chk .ic { width: 12px; height: 12px; opacity: 0; }\n.chk.on .ic { opacity: 1; }\n\n/* =====================================================================\n   Segmented control / pivots / chips\n   ===================================================================== */\n.segmented { display: inline-flex; background: var(--control-secondary); border: 1px solid var(--stroke-control);\n  border-radius: var(--radius-control); padding: 2px; gap: 2px; }\n.segmented button { border: 0; background: transparent; color: var(--text-secondary);\n  font-family: inherit; font-size: 13px; font-weight: 600; height: 28px; padding: 0 12px;\n  border-radius: 3px; cursor: pointer; }\n.segmented button.on { background: var(--card-default); color: var(--text-primary); box-shadow: var(--shadow-card); }\n\n.pivot { display: flex; gap: var(--space-4); border-bottom: 1px solid var(--stroke-divider); }\n.pivot button { position: relative; border: 0; background: transparent; color: var(--text-secondary);\n  font-family: inherit; font-size: 15px; font-weight: 600; padding: 10px 2px; cursor: pointer; }\n.pivot button.on { color: var(--text-primary); }\n.pivot button.on::after { content: \"\"; position: absolute; left: 0; right: 0; bottom: -1px; height: 2.5px;\n  border-radius: 2px; background: var(--accent-fill); }\n\n.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px;\n  border-radius: var(--radius-pill); border: 1px solid var(--stroke-control);\n  background: var(--control-default); font-size: 13px; cursor: pointer; }\n.chip:hover { background: var(--subtle-hover); }\n.chip.on { background: var(--accent-selected-bg); border-color: transparent; color: var(--accent-text); font-weight: 600; }\n\n/* =====================================================================\n   Filters sidebar\n   ===================================================================== */\n.filters { display: flex; flex-direction: column; gap: var(--space-4); }\n.filter-group .fg-title { font-weight: 600; font-size: 13px; margin-bottom: var(--space-2); }\n.filter-row { display: flex; align-items: center; gap: var(--space-2); padding: 5px 0; color: var(--text-secondary); cursor: pointer; font-size: 13px; }\n.filter-row:hover { color: var(--text-primary); }\n.filter-row .cnt { margin-left: auto; color: var(--text-tertiary); font-size: 12px; }\n\n/* =====================================================================\n   Scan progress bar (persistent footer)\n   ===================================================================== */\n.scanbar {\n  grid-area: scanbar;\n  display: flex; align-items: center; gap: var(--space-3);\n  padding: 8px var(--space-6); min-height: 44px;\n  border-top: 1px solid var(--stroke-divider);\n  background: var(--solid-tertiary);\n}\n.scanbar .ic { color: var(--accent-text); }\n.scanbar .sb-vol { font-weight: 600; }\n.scanbar .sb-bar { flex: 1; max-width: 360px; }\n.scanbar .sb-meta { color: var(--text-secondary); font-size: 12px; font-variant-numeric: tabular-nums; }\n.scanbar .sb-actions { margin-left: auto; display: flex; gap: 4px; }\n.spin { animation: spin 1.1s linear infinite; transform-origin: 50% 50%; }\n@keyframes spin { to { transform: rotate(360deg); } }\n\n/* =====================================================================\n   Empty state\n   ===================================================================== */\n.empty { display: flex; flex-direction: column; align-items: center; justify-content: center;\n  text-align: center; gap: var(--space-4); padding: var(--space-12); color: var(--text-secondary); }\n.empty .art { width: 120px; height: 96px; color: var(--text-tertiary); opacity: .8; }\n.empty h3 { color: var(--text-primary); margin: 0; font-size: 18px; font-weight: 600; }\n.empty p { margin: 0; max-width: 380px; }\n\n/* =====================================================================\n   Skeleton\n   ===================================================================== */\n.skel { background: linear-gradient(90deg, var(--subtle-secondary) 25%, var(--subtle-hover) 37%, var(--subtle-secondary) 63%);\n  background-size: 400% 100%; animation: shimmer 1.4s ease infinite; border-radius: 4px; }\n@keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }\n\n/* =====================================================================\n   File instance row + logical file\n   ===================================================================== */\n.fi-row { display: flex; align-items: center; gap: var(--space-3); padding: 8px var(--space-3);\n  border-radius: var(--radius-control); border: 1px solid transparent; }\n.fi-row:hover { background: var(--subtle-hover); border-color: var(--stroke-card); }\n.fi-path { font-family: \"Cascadia Code\", \"Consolas\", monospace; font-size: 12.5px; color: var(--text-secondary);\n  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }\n.vol-badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px;\n  border-radius: var(--radius-control); background: var(--subtle-secondary); border: 1px solid var(--stroke-control);\n  font-size: 12px; font-weight: 600; white-space: nowrap; }\n\n.cover { aspect-ratio: 2/3; border-radius: 6px; background: var(--cover-1); position: relative; overflow: hidden;\n  box-shadow: var(--shadow-card); display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; color: #fff; }\n.cover.v2 { background: var(--cover-2); } .cover.v3 { background: var(--cover-3); }\n.cover .c-title { font-size: 13px; font-weight: 600; line-height: 1.2; text-shadow: 0 1px 3px rgba(0,0,0,.4); }\n.cover .c-auth { font-size: 11px; opacity: .85; }\n.cover.wide { aspect-ratio: 16/10; }\n\n/* =====================================================================\n   Tooltip / teaching tip / toast\n   ===================================================================== */\n.toast { display: inline-flex; align-items: center; gap: var(--space-3); padding: 10px var(--space-4);\n  background: var(--solid-quarternary); border: 1px solid var(--stroke-card); border-radius: var(--radius-card);\n  box-shadow: var(--shadow-flyout); }\n.toast .ic { color: var(--accent-text); }\n\n/* =====================================================================\n   ToggleSwitch (Fluent ToggleSwitch)\n   ===================================================================== */\n.toggle { position: relative; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }\n.toggle .track {\n  width: 40px; height: 20px; border-radius: var(--radius-pill); flex: 0 0 auto;\n  background: var(--control-strong); border: 1px solid var(--stroke-control-strong);\n  position: relative; transition: background var(--motion-fast) var(--ease-standard);\n}\n.toggle .track::after {\n  content: \"\"; position: absolute; top: 50%; ius: var(--radius-control);\n  background: var(--card-secondary); border: 1px solid var(--stroke-card);\n}\n.scope-row .combinator { font-size: 12px; font-weight: 700; color: var(--accent-text); width: 34px; flex: 0 0 auto; text-align: center; }\n.cond-pill {\n  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: var(--radius-control);\n  background: var(--control-default); border: 1px solid var(--stroke-control); font-size: 13px; cursor: pointer; white-space: nowrap;\n}\n.cond-pill.field { font-weight: 600; }\n.cond-pill.op { background: transparent; border-style: dashed; color: var(--text-secondary); }\n.cond-pill.value { color: var(--accent-text); border-color: var(--accent-selected-bg); background: var(--accent-selected-bg); font-weight: 600; }\n.cond-pill .ic { width: 12px; height: 12px; opacity: .6; }\n\n/* =====================================================================\n   Code editor (Scriban) + diff path\n   ===================================================================== */\n.code-editor {\n  font-family: \"Cascadia Code\", \"Consolas\", monospace; font-size: 13px; line-height: 1.7;\n  background: var(--solid-quarternary); border: 1px solid var(--stroke-control);\n  border-radius: var(--radius-card); padding: var(--space-4) var(--space-4) var(--space-4) 0; overflow: auto;\n}\n.code-editor .ln { display: flex; }\n.code-editor .gutter { width: 44px; flex: 0 0 auto; text-align: right; padding-right: 14px; color: var(--text-tertiary); user-select: none; }\n.code-editor .code { flex: 1; white-space: pre; padding-right: var(--space-4); }\n.tok-tag { color: var(--accent-text); }\n.tok-key { color: var(--info); }\n.tok-str { color: #B08D57; }\n[data-theme=\"dark\"] .tok-str { color: #d9b878; }\n.tok-fn  { color: var(--text-primary); font-weight: 600; }\n.tok-com { color: var(--text-tertiary); font-style: italic; }\n.tok-punc { color: var(--text-secondary); }\n\n.path-mono { font-family: \"Cascadia Code\", \"Consolas\", monospace; font-size: 12.5px; white-space: nowrap; }\n.path-del { color: var(--danger); text-decoration: line-through; opacity: .8; }\n.path-add { color: var(--success); font-weight: 600; }\n.diff-ins { background: var(--success-bg); color: var(--success); border-radius: 3px; padding: 0 3px; }\n.diff-rem { background: var(--danger-bg); color: var(--danger); border-radius: 3px; padding: 0 3px; text-decoration: line-through; }\n\n/* =====================================================================\n   Waveform compare (audio doublons)\n   ===================================================================== */\n.waveform { display: flex; align-items: center; gap: 2px; height: 72px; }\n.waveform .wbar { flex: 1; border-radius: 1px; background: var(--accent-fill); opacity: .55; min-width: 2px; }\n.waveform.b .wbar { background: #7E8AA6; opacity: .85; }\n.wf-overlay { position: relative; }\n.wf-overlay .waveform { position: absolute; inset: 0; }\n.wf-overlay .waveform.a { opacity: 1; }\n\n/* =====================================================================\n   Settings layout\n   ===================================================================== */\n.settings-nav { display: flex; flex-direction: column; gap: 2px; }\n.settings-nav .sn-item {\n  display: flex; align-items: center; gap: var(--space-3); height: 40px; padding: 0 12px;\n  border-radius: var(--radius-control); cursor: pointer; color: var(--text-primary); border: 1px solid transparent;\n}\n.settings-nav .sn-item .ic { color: var(--text-secondary); }\n.settings-nav .sn-item:hover { background: var(--subtle-hover); }\n.settings-nav .sn-item.active { background: var(--card-default); border-color: var(--stroke-card); box-shadow: var(--shadow-card); }\n.settings-nav .sn-item.active .ic { color: var(--accent-text); }\n.set-row { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-4) 0; border-bottom: 1px solid var(--stroke-divider); }\n.set-row:last-child { border-bott \" x2=\"21\" y2=\"12\" stroke=\"currentColor\"><\u002Fline><\u002Fsvg><\u002Fbutton>\n      <button class=\"win-btn\" aria-label=\"Agrandir\"><svg class=\"ic\" style=\"width:11px;height:11px\"><rect x=\"4\" y=\"4\" width=\"16\" height=\"16\" rx=\"1.5\"><\u002Frect><\u002Fsvg><\u002Fbutton>\n      <button class=\"win-btn close\" aria-label=\"Fermer\"><svg class=\"ic\" style=\"width:11px;height:11px\"><use href=\"#i-close\"><\u002Fuse><\u002Fsvg><\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ===================== CONTENT ===================== -->\n  <main class=\"content\"><div class=\"page\" id=\"page\"><\u002Fdiv><\u002Fmain>\n\n  <!-- ===================== SCAN BAR ===================== -->\n  <footer class=\"scanbar\" id=\"scanbar\">\n    <svg class=\"ic spin\"><use href=\"#i-scan\"><\u002Fuse><\u002Fsvg>\n    <span class=\"sb-vol\">NAS-Familial<\u002Fspan>\n    <span class=\"sb-meta\">Indexation · 38 240 / 51 900 fichiers<\u002Fspan>\n    <div class=\"sb-bar bar\"><i style=\"width:74%\"><\u002Fi><\u002Fdiv>\n    <span class=\"sb-meta\">2 130 fich./s · ~6 min restantes<\u002Fspan>\n    <div class=\"sb-actions\">\n      <button class=\"btn subtle sm icon-only\" title=\"Détails\"><svg class=\"ic\"><use href=\"#i-chev-d\"><\u002Fuse><\u002Fsvg><\u002Fbutton>\n      <button class=\"btn subtle sm icon-only\" title=\"Pause\"><svg class=\"ic\"><use href=\"#i-pause\"><\u002Fuse><\u002Fsvg><\u002Fbutton>\n      <button class=\"btn subtle sm icon-only\" title=\"Annuler\"><svg class=\"ic\"><use href=\"#i-close\"><\u002Fuse><\u002Fsvg><\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<script src=\"196b28ff-6769-42dc-9c16-99bdd620b5f7\"><\u002Fscript>\n<script src=\"53999cad-2815-44b9-b74c-67febf0b0586\"><\u002Fscript>\n<script src=\"1795395d-dfa1-4913-8d37-61ef2901f5d9\"><\u002Fscript>\n<script src=\"59fb7eeb-4681-4574-9cee-9a4d01852f20\"><\u002Fscript>\n<script src=\"1acf1d9c-a789-4365-ac97-30089dd2327a\"><\u002Fscript>\n<script src=\"31778d42-97bc-4cbf-9cd1-9d8bcd86844e\"><\u002Fscript>\n<script src=\"b686c994-7cb7-4495-ba95-70cac8c12869\"><\u002Fscript>\n<script src=\"e9e3afa0-bd0a-4a2f-9feb-a82e07fc2179\"><\u002Fscript>\n<script src=\"44e9d1b0-e3ed-4a9f-b0fc-71edab789526\"><\u002Fscript>\n<script src=\"c4b0ecf5-007d-45c4-8d11-0d36a702b7eb\"><\u002Fscript>\n<script src=\"af56b04f-60b0-44eb-901b-38be063bf7a1\"><\u002Fscript>\n<script src=\"3c678524-8e42-4480-bd58-2b847a1185d8\"><\u002Fscript>\n<script>\n(function(){\n  const NAV = [\n    { group: null, items: [\n      { route:\"dashboard\", label:\"Tableau de bord\", icon:\"i-dashboard\" },\n    ]},\n    { group: \"Bibliothèque\", items: [\n      { route:\"volumes\",   label:\"Volumes\",        icon:\"i-drive\" },\n      { route:\"catalog\",   label:\"Catalogue\",      icon:\"i-library\" },\n      { route:\"duplicates\",label:\"Doublons\",       icon:\"i-duplicate\", badge:\"1,2k\" },\n    ]},\n    { group: \"Opérations\", items: [\n      { route:\"normalize\", label:\"Uniformisation\", icon:\"i-rename\" },\n      { route:\"triage\",    label:\"Triage\",         icon:\"i-triage\", badge:\"142\" },\n      { route:\"placement\", label:\"Plan de placement\", icon:\"i-placement\" },\n    ]},\n    { group: \"Système\", items: [\n      { route:\"taxonomy\",  label:\"Taxonomie\",      icon:\"i-taxonomy\" },\n      { route:\"history\",   label:\"Historique\",     icon:\"i-history\" },\n    ]},\n  ];\n\n  const navList = document.getElementById('navList');\n  NAV.forEach(sec => {\n    if (sec.group) {\n      const h = document.createElement('li');\n      h.className = 'nav-group-label'; h.textContent = sec.group;\n      navList.appendChild(h);\n    }\n    sec.items.forEach(it => {\n      const li = document.createElement('li');\n      li.className = 'nav-item'; li.dataset.route = it.route; li.tabIndex = 0;\n      li.innerHTML = `<svg class=\"ic ic-20\"><use href=\"#${it.icon}\"/><\u002Fsvg><span class=\"nav-label\">${it.label}<\u002Fspan>` +\n        (it.badge ? `<span class=\"nav-badge\">${it.badge}<\u002Fspan>` : '');\n      navList.appendChild(li);\n    });\n  });\n\n  const page = document.getElementById('page');\n  function render(route){\n    document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.route===route));\n    const fn = (window.Screens||{})[route];\n    page.scrollTop = 0;\n    page.innerHTML = fn ? fn() : (window.Screens.placeholder ? window.Screens.placeholder(route) : '<div class=\"empty\"><h3>'+route+'<\u002Fh3><\u002Fdiv>');\n    if (window.ScreenInit && window.ScreenInit[route]) window.ScreenInit[route](page);\n    localStorage.setItem('arboryn-route', route);\n    if (location.hash.slice(1) !== route) location.hash = route;\n  }\n  window.addEventListener('hashchange', () => {\n    const r = location.hash.slice(1);\n    if (r && !document.querySelector('.nav-item.active[data-route=\"'+r+'\"]')) render(r);\n  });\n\n  document.addEventListener('click', e => {\n    const item = e.target.closest('.nav-item');\n    if (item && item.dataset.route) render(item.dataset.route);\n  });\n  navList.addEventListener('keydown', e => {\n    if ((e.key==='Enter'||e.key===' ') && e.target.dataset.route){ e.preventDefault(); render(e.target.dataset.route); }\n  });\n\n  // Rail collapse\n  document.getElementById('railToggle').addEventListener('click', () => {\n    const app = document.getElementById('app');\n    app.dataset.rail = app.dataset.rail==='collapsed' ? 'expanded' : 'collapsed';\n  });\n\n  // Theme toggle\n  const themeBtn = document.getElementById('themeBtn');\n  function applyTheme(t){ document.documentElement.dataset.theme = t; localStorage.setItem('arboryn-theme', t); }\n  themeBtn.addEventListener('click', () => {\n    applyTheme(document.documentElement.dataset.theme==='dark' ? 'light' : 'dark');\n  });\n  applyTheme(localStorage.getItem('arboryn-theme') || 'light');\n\n  // Keyboard shortcuts\n  document.addEventListener('keydown', e => {\n    if (e.ctrlKey && e.key.toLowerCase()==='b'){ e.preventDefault(); document.getElementById('railToggle').click(); }\n    if (e.ctrlKey && e.key==='/'){ e.preventDefault(); document.querySelector('.titlebar .search input').focus(); }\n  });\n\n  const startRoute = location.hash.slice(1) || localStorage.getItem('arboryn-route') || 'dashboard';\n  render(startRoute);\n  window.__nav = render;\n})();\n<\u002Fscript>\n\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
